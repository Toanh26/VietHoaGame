[project]
name = "vntrans"
version = "0.1.0"
description = "Bộ công cụ Việt hoá game: trích xuất văn bản, dịch (Claude hoặc thủ công), ghi ngược vào game"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic"]

[project.scripts]
vntrans = "vntrans.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vntrans", "vntrans.adapters", "vntrans.auto"]

[tool.setuptools.package-data]
vntrans = ["assets/*"]
