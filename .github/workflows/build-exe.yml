name: Build VietHoaGame.exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build
        run: |
          python -m pip install pyinstaller anthropic
          python -m PyInstaller --noconfirm --onefile --windowed --name VietHoaGame --add-data "vntrans\assets;vntrans\assets" --collect-submodules anthropic --copy-metadata anthropic vntrans_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: VietHoaGame
          path: dist/VietHoaGame.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VietHoaGame.exe
